<style>
:root{
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#faf8f4; --fg:#1c1917; --dim:#6b625a; --line:#ddd4c6;
  --card:#fffdfa; --accent:#a8761f; --accent-soft:#f5e9d2;
  --code-bg:#f2ece1; --warn-bg:#fdf6e3; --warn-line:#d9a441;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16140f; --fg:#eee8dd; --dim:#9a9084; --line:#3a3428;
    --card:#1f1c15; --accent:#e0b158; --accent-soft:#2e2718;
    --code-bg:#221e16; --warn-bg:#26200f; --warn-line:#7a6224; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
code{font-family:var(--mono);font-size:.855em;background:var(--code-bg);
  padding:.14em .38em;border-radius:5px;overflow-wrap:break-word}
.back{color:inherit;text-decoration:none}
.back:hover span{text-decoration:underline}

:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{flex:1;width:100%;max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 2.2rem) 1.25rem 2rem;
  display:flex;flex-direction:column;justify-content:center;gap:2.6rem}
.mark{font:700 .78rem/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.mark::before{content:"";display:inline-block;width:.62rem;height:.62rem;margin-right:.55rem;
  border:2px solid var(--accent);border-radius:50%;vertical-align:-.05rem}
figure{margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
/* * = prepnuti mezi presnym (vychozi) a volnejsim prekladem */
.alt{position:absolute;top:-.55rem;right:-.6rem;width:44px;height:44px;display:grid;place-items:center;
  font:600 1.35rem/1 var(--serif);color:var(--dim);background:none;border:0;border-radius:50%;
  cursor:pointer;opacity:.7;-webkit-tap-highlight-color:transparent;transition:color .15s,opacity .15s}
.alt:hover{opacity:1;color:var(--fg)}
.alt[aria-pressed="true"]{color:var(--accent);opacity:1}
.alt[hidden]{display:none}
blockquote{margin:0;font:400 1.5rem/1.5 var(--serif);letter-spacing:-.005em;
  text-wrap:pretty;transition:opacity .45s ease}
blockquote::before{content:"“";display:block;font-size:3rem;line-height:.6;
  color:var(--accent);margin-bottom:.55rem}
figcaption{margin-top:1rem;font:.8rem/1.4 var(--sans);color:var(--dim);transition:opacity .45s ease}
figcaption::before{content:"— "}
.fading blockquote,.fading figcaption{opacity:0}
nav{display:grid;gap:.75rem}
nav a{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  min-height:64px;padding:1rem 1.2rem;background:var(--card);border:1px solid var(--line);
  border-radius:14px;color:var(--fg);text-decoration:none;font-weight:600;font-size:1.06rem;
  transition:border-color .15s,transform .15s}
nav a small{display:block;font-weight:400;font-size:.82rem;color:var(--dim);margin-top:.15rem}
nav a::after{content:"→";color:var(--accent);font-size:1.2rem;flex:0 0 auto}
nav a:hover{border-color:var(--accent)}
nav a:active{transform:scale(.99)}
footer{padding:0 1.25rem calc(env(safe-area-inset-bottom) + 1.4rem);text-align:center;
  font:.72rem/1.6 var(--sans);color:var(--dim)}
@media (min-width:640px){
  blockquote{font-size:1.78rem}
  nav{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){blockquote,figcaption{transition:none}}

<script>
(function(){
  var Q = [{"text":"Ať se nevrací k minulému, ať netouží po budoucím. Co minulo, je opuštěno, a budoucí ještě nepřišlo. Kdo jasně vidí to, co je přítomné, tady a teď, neochvějně a neotřesitelně — ten moudrý ať to rozvíjí.","loose":"Nevracej se k minulosti, nestav na budoucnosti. Minulé už odešlo, budoucí ještě nepřišlo. Co se děje teď, to pozoruj jasně — tady a teď.","source":"Majjhima Nikāya 131 · Bhaddekaratta sutta"},{"text":"Netruchlí nad minulým, netouží po budoucím, žijí z přítomného. Proto je jejich tvář jasná.","loose":"Netrápí se tím, co minulo, netouží po tom, co přijde; žijí z toho, co je teď. Proto je jejich tvář klidná.","source":"Saṃyutta Nikāya 1.10 · Arañña sutta"},{"text":"Tak by ses měl cvičit, Báhijo: ve viděném bude jen viděné, ve slyšeném jen slyšené, ve vnímaném jen vnímané, v poznaném jen poznané.","loose":"Ve viděném ať je jen viděné, ve slyšeném jen slyšené, v pocítěném jen pocítěné, v poznaném jen poznané.","source":"Udāna 1.10 · Bāhiya sutta"},{"text":"Bdělost je stezkou k nesmrtelnému, nedbalost stezkou smrti. Bdělí neumírají; nedbalí jsou jako mrtví.","loose":"Bdělost je cestou k nesmrtelnému, nedbalost cestou ke smrti. Bdělí neumírají; nedbalí jsou jako mrtví.","source":"Dhammapada 21"},{"text":"Mysl předchází všem stavům, mysl je jejich vůdcem, z mysli jsou utvořeny. Kdo mluví nebo jedná se zkaženou myslí, toho následuje dukkha jako kolo kopyto zvířete, které táhne vůz.","loose":"Mysl předchází všem věcem, mysl je jejich vůdcem; z mysli jsou utkány.","source":"Dhammapada 1"},{"text":"Pusť to, co je před tebou, pusť to, co je za tebou, pusť i to, co je uprostřed, a přejdi na druhý břeh bytí. S myslí ve všem osvobozenou už nepřijdeš znovu ke zrození a stárnutí.","loose":"Pusť, co je před tebou, pusť, co je za tebou, pusť i to, co je mezi. S myslí volnou ve všem se už nevrátíš ke zrození a stárnutí.","source":"Dhammapada 348"},{"text":"Ale všímavost, mniši, říkám, je užitečná všude.","loose":"Všímavost je ale, mniši, užitečná vždy a všude.","source":"Saṃyutta Nikāya 46.53"},{"text":"Z úsilného cvičení se rodí moudrost, bez cvičení moudrost ubývá.","loose":"Z ponoření se rodí moudrost, bez něj moudrost uvadá.","source":"Dhammapada 282"},{"text":"Radujte se z bdělosti, střežte svou mysl. Vytáhněte se z nesnází jako slon uvízlý v bahně.","loose":"Radujte se z bdělosti, střežte svou mysl.","source":"Dhammapada 327"},{"text":"Když se dlouze nadechuje, ví: „Dlouze se nadechuji.“ Když dlouze vydechuje, ví: „Dlouze vydechuji.“ Když se krátce nadechuje, ví: „Krátce se nadechuji.“ Když krátce vydechuje, ví: „Krátce vydechuji.“","loose":"Když se dlouze nadechuje, ví: „Dlouze se nadechuji.“ Když krátce vydechuje, ví: „Krátce vydechuji.“","source":"Majjhima Nikāya 118 · Ānāpānasati sutta"},{"text":"Úsilím, bdělostí, zdrženlivostí a sebeovládáním ať si moudrý vytvoří ostrov, který povodeň nezaplaví.","loose":"Úsilím, bdělostí, uměřeností a sebeovládáním si moudrý staví ostrov, který žádná povodeň nezaplaví.","source":"Dhammapada 25"},{"text":"Kdo chrání sebe, mniši, chrání druhého; kdo chrání druhého, chrání sebe.","loose":"Kdo chrání sebe, chrání druhé; kdo chrání druhé, chrání sebe.","source":"Saṃyutta Nikāya 47.19 · Sedaka sutta"},{"text":"Mysl předchází všem stavům, mysl je jejich vůdcem, z mysli jsou utvořeny. Kdo mluví nebo jedná s jasnou myslí, toho následuje štěstí jako stín, který neodchází.","loose":"Mysl předchází všem věcem, mysl je jejich vůdcem. Kdo mluví a jedná s čistou myslí, toho následuje štěstí jako stín, který nikdy neodejde.","source":"Dhammapada 2"},{"text":"„Urážel mě, bil mě, přemohl mě, okradl mě.“ Kdo v sobě takové myšlenky chová, v tom nepřátelství neutichne.","loose":"„Urazil mě, uhodil mě, porazil mě, okradl mě.“ Kdo v sobě nosí takové myšlenky, v tom nenávist neutichne.","source":"Dhammapada 3"},{"text":"Nepřátelství se nepřátelstvím nikdy neutiší. Utiší je jen to, co nepřátelstvím není. To je odvěký zákon (dhamma).","loose":"Nenávist se nenávistí nikdy neutiší. Utiší ji jen nenávist odložená — to je věčný zákon.","source":"Dhammapada 5"},{"text":"Ostatní nechápou, že tu jednou zemřeme. Kdo to chápe, v tom spory utichnou.","loose":"Jiní nechápou, že jednou všichni odejdeme. Kdo to chápe, tomu spory samy utichnou.","source":"Dhammapada 6"},{"text":"Jako déšť proniká špatně krytým domem, tak vášeň proniká nerozvinutou myslí.","loose":"Jako déšť proniká špatně krytou střechou, tak vášeň proniká neucvičenou myslí.","source":"Dhammapada 13"},{"text":"Jako déšť neprojde dobře krytým domem, tak vášeň neprojde dobře rozvinutou myslí.","loose":"Jako déšť neprojde dobře krytou střechou, tak vášeň neprojde myslí, která je ucvičená.","source":"Dhammapada 14"},{"text":"I když hodně recituje z písem, nedbalý člověk, který podle nich nejedná, je jako pastýř, který počítá cizí krávy: na plodech asketického života nemá podíl.","loose":"Kdo odříká mnoho moudrých slov, ale nežije podle nich, je jako pastýř, který počítá cizí krávy.","source":"Dhammapada 19"},{"text":"Pošetilí a nemoudří se oddávají nedbalosti. Moudrý střeží bdělost jako nejcennější poklad.","loose":"Pošetilí se oddávají nedbalosti. Moudrý střeží bdělost jako svůj největší poklad.","source":"Dhammapada 26"},{"text":"Chvějivou, neklidnou mysl, kterou je těžké uhlídat a těžké zadržet, moudrý narovná, jako šípař rovná šíp.","loose":"Těkavou, neklidnou mysl, kterou je těžké uhlídat, moudrý narovná, jako šípař rovná šíp.","source":"Dhammapada 33"},{"text":"Dobré je krotit mysl, kterou je těžké zadržet, která je lehká a dopadá, kam se jí zachce. Zkrocená mysl přináší štěstí.","loose":"Je dobré zkrotit mysl, která je prchlivá a jde, kam se jí zachce. Zkrocená mysl přináší štěstí.","source":"Dhammapada 35"},{"text":"Cokoli udělá nepřítel nepříteli nebo nenávistník nenáviděnému — špatně nasměrovaná mysl udělá člověku ještě hůř.","loose":"Co nepřítel udělá nepříteli, co nenávistný nenáviděnému — víc zla ti způsobí tvá vlastní, špatně vedená mysl.","source":"Dhammapada 42"},{"text":"Co mu neudělá matka, otec ani jiní příbuzní, to dobré mu udělá dobře nasměrovaná mysl — a ještě víc.","loose":"Ani matka, ani otec, ani žádný příbuzný ti neprokáže tolik dobra jako tvá vlastní, dobře vedená mysl.","source":"Dhammapada 43"},{"text":"Jako včela sbírá nektar a odlétá, aniž poškodí barvu a vůni květu, tak ať mudrc chodí vesnicí.","loose":"Jako včela sbírá nektar a odlétá, aniž by poškodila barvu či vůni květu, tak ať mudrc prochází vesnicí.","source":"Dhammapada 49"},{"text":"Ne na prohřešky druhých, ne na to, co druzí udělali a neudělali: ať hledí jen na to, co sám udělal a neudělal.","loose":"Nehledej chyby druhých, co udělali a co ne. Hleď na to, co jsi udělal a neudělal ty sám.","source":"Dhammapada 50"},{"text":"Jako krásný květ, barevný, ale bez vůně, tak jsou dobře vyslovená slova bez užitku tomu, kdo podle nich nejedná.","loose":"Jako krásný květ, který má barvu, ale nevoní, jsou krásná slova toho, kdo podle nich nejedná.","source":"Dhammapada 51"},{"text":"Dlouhá je noc bdícímu, dlouhá je míle unavenému, dlouhý je samsára pošetilým, kteří neznají pravou Dhammu.","loose":"Dlouhá je noc tomu, kdo bdí, dlouhá je míle unavenému, dlouhý je koloběh životů pošetilým, kteří neznají pravdu.","source":"Dhammapada 60"},{"text":"Když na cestě nenajdeš lepšího ani rovného sobě, putuj pevně sám. S pošetilým není přátelství.","loose":"Když nenajdeš druha lepšího nebo rovného sobě, jdi pevně sám. S pošetilým není společné cesty.","source":"Dhammapada 61"},{"text":"„Mám syny, mám bohatství,“ trápí se pošetilý. Ani sám sebe nevlastní — kde pak syny, kde bohatství?","loose":"„Mám syny, mám majetek,“ trápí se pošetilý. Vždyť ani sám sebe nevlastní — jak by pak syny, jak majetek?","source":"Dhammapada 62"},{"text":"Pošetilý, který zná svou pošetilost, je v tom aspoň moudrý. Pošetilý, který se má za moudrého, je pošetilý doopravdy.","loose":"Pošetilý, který ví o své pošetilosti, je aspoň v tom moudrý. Pošetilý, který se má za moudrého, je pošetilý doopravdy.","source":"Dhammapada 63"},{"text":"I kdyby pošetilý celý život sloužil moudrému, Dhammu nepozná — jako lžíce nepozná chuť polévky.","loose":"I kdyby pošetilý celý život pobýval u moudrého, pravdu nepozná — jako lžíce nepozná chuť polévky.","source":"Dhammapada 64"},{"text":"Když vidíš moudrého, který ukazuje chyby a kárá, jako by ukazoval cestu k pokladu, drž se takového. Kdo se drží takového, tomu je líp, ne hůř.","loose":"Na toho, kdo ti ukáže tvé chyby, hleď jako na toho, kdo ti ukazuje skrytý poklad.","source":"Dhammapada 76"},{"text":"Zavlažovači vedou vodu, šípaři rovnají šípy, tesaři ohýbají dřevo, moudří krotí sami sebe.","source":"Dhammapada 80"},{"text":"Jako pevnou skálou vítr nepohne, tak moudrými nepohne hana ani chvála.","loose":"Jako pevnou skálou nepohne vítr, tak moudrým nepohne chvála ani hana.","source":"Dhammapada 81"},{"text":"Jako je hluboké jezero průzračné a nezkalené, tak se moudří projasní, když uslyší Dhammu.","loose":"Jako hluboké jezero je čiré a klidné, tak se zklidní moudrý, když uslyší pravdu.","source":"Dhammapada 82"},{"text":"Mezi lidmi je málo těch, kdo jdou na druhý břeh. Ostatní jen pobíhají po tomto břehu.","loose":"Málokdo z lidí dojde na druhý břeh. Ostatní jen pobíhají sem a tam po tomhle.","source":"Dhammapada 85"},{"text":"Lepší než tisíc slov bez užitku je jediné užitečné slovo, po kterém se člověk zklidní.","loose":"Lepší než tisíc prázdných slov je jediné slovo s významem, po kterém se člověk uklidní.","source":"Dhammapada 100"},{"text":"Kdo v bitvě porazí tisíckrát tisíc mužů — a kdo přemůže jediného, sebe: ten je největší z vítězů.","loose":"Kdyby v bitvě porazil tisíckrát tisíc mužů — největším vítězem je ten, kdo přemůže sám sebe.","source":"Dhammapada 103"},{"text":"Lepší než sto let života bez moudrosti a bez soustředění je jediný den moudrého, který medituje.","loose":"Lepší jeden den života moudrého a soustředěného než sto let života bez moudrosti a bez soustředění.","source":"Dhammapada 111"},{"text":"Lepší než sto let života bez vhledu do vznikání a zanikání je jediný den toho, kdo vznikání a zanikání vidí.","loose":"Lepší jeden den života, kdy člověk vidí vznik a zánik věcí, než sto let, kdy ho nevidí.","source":"Dhammapada 113"},{"text":"Pospěš si s dobrým, chraň mysl před zlým. Kdo dělá záslužné váhavě, tomu se mysl těší ze zlého.","loose":"Pospěš si s dobrým, odvracej mysl od zlého. Kdo dělá dobro váhavě, jeho mysl si ve zlém libuje.","source":"Dhammapada 116"},{"text":"Nepodceňuj zlo: „To na mě nepřijde.“ Kapka po kapce se naplní i džbán; pošetilý se naplní zlem, i když ho sbírá po troškách.","loose":"Nepodceňuj zlo, že tě nedostihne. I džbán se naplní kapku po kapce; pošetilý se plní zlem po troškách.","source":"Dhammapada 121"},{"text":"Nepodceňuj záslužné: „To na mě nepřijde.“ Kapka po kapce se naplní i džbán; moudrý se naplní záslužným, i když ho sbírá po troškách.","loose":"Nepodceňuj dobro, že ti nic nepřinese. I džbán se naplní kapku po kapce; moudrý se plní dobrem po troškách.","source":"Dhammapada 122"},{"text":"Všichni se chvějí před holí, všichni se bojí smrti. Když vezmeš sebe za měřítko, nezabíjej a nedávej zabíjet.","loose":"Všichni se chvějí před holí, všichni se bojí smrti. Kdo se vžije do druhého, nezabije a nenechá zabíjet.","source":"Dhammapada 129"},{"text":"Nemluv k nikomu hrubě; komu tak promluvíš, ten ti odpoví stejně. Hádavá řeč bolí a rány se ti vrátí.","loose":"Nemluv k nikomu hrubě; komu tak promluvíš, ten ti odpoví stejně.","source":"Dhammapada 133"},{"text":"Proč smích, proč radost, když všechno stále hoří? Zahaleni tmou — proč nehledáte světlo?","loose":"Proč smích, proč veselí, když svět stále hoří? Jste zahaleni tmou — proč nehledáte světlo?","source":"Dhammapada 146"},{"text":"Zdobené královské vozy chátrají, i tělo zestárne. Ale Dhamma dobrých nestárne — tak to dobří předávají dobrým.","loose":"Zdobené královské vozy zchátrají, i tělo zestárne. Ale pravda dobrých nestárne.","source":"Dhammapada 151"},{"text":"Kdo se málo učil, stárne jako vůl: maso mu přibývá, moudrost ne.","source":"Dhammapada 152"},{"text":"Mnoha zrozeními samsáry jsem marně putoval a hledal stavitele domu; strastné je rodit se znovu a znovu. Staviteli domu, jsi spatřen! Znovu už dům nepostavíš. Všechny tvé trámy jsou zlámané, vrchol střechy rozbitý. Mysl došla k nepodmíněnému, dosáhla konce žízně.","loose":"Mnoha zrozeními jsem marně putoval a hledal stavitele domu. Staviteli domu, jsi odhalen — znovu už dům nepostavíš.","source":"Dhammapada 153–154"},{"text":"Ať se nejdřív sám usadí v tom, co je správné, a teprve pak učí druhé. Tak se moudrý neposkvrní.","loose":"Ať se člověk nejdřív sám ustálí v tom, co je správné, a teprve pak učí druhé. Tak moudrý neupadne v hanu.","source":"Dhammapada 158"},{"text":"Ať dělá sám tak, jak radí druhým. Kdo je dobře zkrocen, ať krotí — vždyť sebe zkrotit je těžké.","loose":"Jak radíš druhým, tak dělej sám. Jen kdo zkrotil sebe, ať krotí druhé — sebe zkrotit je skutečně těžké.","source":"Dhammapada 159"},{"text":"Sám sobě je člověk ochráncem — kdo jiný by jím mohl být? Kdo sebe dobře zkrotí, získá ochránce, jakého je těžké najít.","loose":"Sám sobě je člověk pánem — kdo jiný by jím mohl být? Kdo dobře zkrotí sám sebe, najde pána, jakého je těžké najít.","source":"Dhammapada 160"},{"text":"Zlo uděláš sám, sám se jím poskvrníš. Zlo sám neuděláš, sám se očistíš. Čistota i nečistota je věcí každého; nikdo nemůže očistit druhého.","loose":"Zlo děláš sám a sám se jím poskvrníš; zlo sám necháš a sám se očistíš. Čistota i nečistota je na každém; nikdo neočistí druhého.","source":"Dhammapada 165"},{"text":"Kdo na svět hledí jako na bublinu, jako na fata morgánu, toho král smrti nevidí.","loose":"Kdo na svět hledí jako na bublinu, jako na fatu morgánu, toho král smrti nespatří.","source":"Dhammapada 170"},{"text":"Kdo byl dřív nedbalý a pak už nedbalý není, ten rozjasní tento svět jako měsíc, když vyjde z mraků.","loose":"Kdo byl dřív nedbalý a pak se stal bdělým, ten rozjasní tenhle svět jako měsíc, když vyjde z mraků.","source":"Dhammapada 172"},{"text":"Tento svět je slepý; málokdo tu vidí jasně. Jako málokterý pták unikne ze sítě, tak málokdo jde do nebe.","loose":"Tenhle svět je slepý; jen málokdo tu vidí jasně.","source":"Dhammapada 174"},{"text":"Těžké je získat lidské zrození, těžký je život smrtelníků, těžké je slyšet pravou Dhammu, vzácné je, když se objeví buddhové.","loose":"Těžké je narodit se člověkem, těžký je život smrtelníků, těžké je uslyšet pravé učení, vzácné je, když se objeví probuzený.","source":"Dhammapada 182"},{"text":"Nedělat žádné zlo, uskutečňovat dobré, očišťovat vlastní mysl — to je učení buddhů.","loose":"Nedělat nic zlého, pěstovat dobré, očistit vlastní mysl — to je učení všech probuzených.","source":"Dhammapada 183"},{"text":"Trpělivá snášenlivost je nejvyšší askezí. Nibbána je nejvyšší, říkají buddhové. Kdo ubližuje druhým, neodešel do bezdomoví; kdo druhé trápí, není asketa.","loose":"Trpělivost a snášenlivost jsou nejvyšší askezí.","source":"Dhammapada 184"},{"text":"Jak šťastně žijeme, bez nepřátelství mezi nepřátelskými. Mezi nepřátelskými lidmi žijeme bez nepřátelství.","loose":"Jak šťastně žijeme, bez nenávisti mezi nenávistnými.","source":"Dhammapada 197"},{"text":"Jak šťastně žijeme, my, kdo nemáme nic. Budeme se živit radostí jako zářící bohové.","loose":"Jak šťastně žijeme, my, kdo nic nevlastníme. Radost nám bude potravou jako zářícím bohům.","source":"Dhammapada 200"},{"text":"Vítězství plodí nepřátelství, poražený uléhá v bolesti. Kdo se zklidnil, uléhá šťastně — opustil vítězství i porážku.","loose":"Vítězství plodí nenávist, poražený žije v bolesti. Klidný žije šťastně — vzdal se vítězství i porážky.","source":"Dhammapada 201"},{"text":"Není ohně jako vášeň, není prohry jako nenávist, není dukkha jako khandhy, není štěstí nad klid.","loose":"Není ohně jako vášeň, není neštěstí jako nenávist, není utrpení jako lpění na sobě, není štěstí nad klid.","source":"Dhammapada 202"},{"text":"Zdraví je největší zisk, spokojenost největší bohatství, důvěra nejlepší příbuzný, nibbána nejvyšší štěstí.","loose":"Zdraví je největší zisk, spokojenost největší bohatství, věrný přítel nejlepší příbuzný, vyhasnutí nejvyšší štěstí.","source":"Dhammapada 204"},{"text":"Z milého se rodí žal, z milého se rodí strach. Kdo je od milého osvobozen, nemá žal — odkud strach?","loose":"Z toho, co je nám drahé, roste žal, z toho, co je nám drahé, roste strach. Kdo je od toho volný, nemá žal — odkud by pak strach?","source":"Dhammapada 212"},{"text":"Kdo zadrží vzkypělý hněv jako rozjetý vůz, toho nazývám vozatajem; ostatní jen drží otěže.","source":"Dhammapada 222"},{"text":"Hněv přemáhej bezhněvem, nedobrého dobrým, lakomce dáváním, lháře pravdou.","loose":"Hněv přemáhej mírností, zlo dobrem, lakotu štědrostí, lháře pravdou.","source":"Dhammapada 223"},{"text":"To je staré, Atulo, ne jen dnešní: hanu sklidí ten, kdo sedí mlčky, hanu ten, kdo mluví hodně, hanu i ten, kdo mluví s mírou. Na světě není nikdo, koho by nehanili.","loose":"Tak to bývalo odjakživa: hanu sklidí ten, kdo mlčí, kdo mluví hodně, i kdo mluví málo. Na světě není nikdo, koho by nehanili.","source":"Dhammapada 227"},{"text":"Nebyl, nebude a ani teď není člověk, kterého by jen hanili, nebo jen chválili.","source":"Dhammapada 228"},{"text":"Udělej si ostrov. Snaž se rychle, buď moudrý.","loose":"Udělej si ze sebe ostrov. Snaž se hned a buď moudrý.","source":"Dhammapada 236"},{"text":"Jako kovář očišťuje stříbro od strusky, tak moudrý odstraňuje své nečistoty: postupně, kousek po kousku, chvíli po chvíli.","source":"Dhammapada 239"},{"text":"Jako rez vzejde ze železa a samo železo rozežere, tak vlastní činy dovedou toho, kdo žije nestřídmě, ke špatnému údělu.","loose":"Jako rez vzejde ze železa a samo železo rozežere, tak vlastní skutky přivedou toho, kdo jedná špatně, ke zlému.","source":"Dhammapada 240"},{"text":"Není ohně jako vášeň, není sevření jako nenávist, není sítě jako klam, není řeky jako žízeň.","source":"Dhammapada 251"},{"text":"Chyby druhých se vidí snadno, vlastní těžko.","source":"Dhammapada 252"},{"text":"Moudrým není proto, že hodně mluví. Kdo je klidný, bez nepřátelství a bez strachu, ten se nazývá moudrým.","loose":"Moudrým není ten, kdo hodně mluví. Moudrý je ten, kdo je klidný, laskavý a nebojácný.","source":"Dhammapada 258"},{"text":"Úsilí musíte vynaložit sami; Tathágatové jen ukazují cestu. Kdo po ní jde a medituje, vyprostí se z Márových pout.","loose":"Úsilí musíte vynaložit sami. Probuzení jen ukazují cestu.","source":"Dhammapada 276"},{"text":"„Všechny sankháry jsou pomíjivé“ — když to člověk vidí moudrostí, odvrací se od dukkha. To je cesta k očištění.","loose":"Všechno složené je pomíjivé. Kdo to moudře prohlédne, odvrátí se od utrpení — to je cesta k čistotě.","source":"Dhammapada 277"},{"text":"Když se vzdáním malého štěstí uvidí velké, ať moudrý malého štěstí zanechá a hledí k velkému.","loose":"Když zřeknutím se malého štěstí lze spatřit štěstí velké, moudrý se malého vzdá a hledí k velkému.","source":"Dhammapada 290"},{"text":"Dobří září zdaleka jako Himálaj. Zlí tu nejsou vidět, jako šípy vystřelené v noci.","loose":"Dobří září zdaleka jako zasněžené hory. Zlí nejsou vidět, jako šípy vystřelené v noci.","source":"Dhammapada 304"},{"text":"Jako slon v bitvě snese šíp vystřelený z luku, tak já snesu urážky; vždyť mnoho lidí je bez ctnosti.","loose":"Jako slon v bitvě snese šípy vystřelené z luku, tak já snesu urážky. Vždyť mnoho lidí jedná špatně.","source":"Dhammapada 320"},{"text":"Když najdeš rozvážného druha, s nímž lze jít, který žije dobře a je moudrý, překonej všechna nebezpečí a jdi s ním spokojeně a všímavě.","loose":"Když najdeš moudrého druha, s nímž lze jít spolu, jdi s ním radostně a bděle a překonáš všechna nebezpečí.","source":"Dhammapada 328"},{"text":"Když vyvstane potřeba, je dobré mít přátele; dobrá je spokojenost s tím, co je; dobré je záslužné, když se život končí; dobré je opuštění všeho dukkha.","loose":"Dobré jsou přátelé, když přijde nouze; dobrá je spokojenost s tím, co je; dobrý je dobrý skutek na konci života; dobré je opustit všechno utrpení.","source":"Dhammapada 331"},{"text":"Dar Dhammy předčí všechny dary, chuť Dhammy všechny chutě, radost z Dhammy všechny radosti. Zánik žízně přemáhá všechno dukkha.","loose":"Dar pravdy předčí všechny dary, chuť pravdy všechny chutě, radost z pravdy všechny radosti. Konec žízně přemůže všechno utrpení.","source":"Dhammapada 354"},{"text":"Vylij, mnichu, vodu z této lodi; vylitá ti popluje lehce. Když odřízneš vášeň a nenávist, dojdeš k nibbáně.","loose":"Vylij vodu z lodi; prázdná popluje rychle. Když odřízneš vášeň a nenávist, dojdeš k vyhasnutí.","source":"Dhammapada 369"},{"text":"Bez moudrosti není jhána, bez jhány není moudrost. V kom je jhána i moudrost, ten je blízko nibbány.","loose":"Bez moudrosti není ponoření, bez ponoření není moudrost. Kdo má obojí, je blízko vyhasnutí.","source":"Dhammapada 372"},{"text":"Sám se pobízej, sám se zkoumej. Sebou střežený a všímavý budeš, mnichu, žít šťastně.","loose":"Sám se pobízej, sám se zkoumej. Kdo sám sebe střeží a je bdělý, bude žít šťastně.","source":"Dhammapada 379"},{"text":"Jako matka chrání vlastním životem svého syna, jediného syna, tak ať ke všem bytostem rozvíjí mysl bez hranic.","loose":"Jako matka chrání své jediné dítě i vlastním životem, tak ať každý pěstuje k všem bytostem mysl bez hranic.","source":"Sutta Nipāta 1.8 · Metta sutta"},{"text":"Ať nikdo nikoho neklame a nikde nikým nepohrdá. Ať si v hněvu ani v nevraživosti nikdo nepřeje druhému dukkha.","loose":"Ať nikdo nikoho neklame a nikým nikde nepohrdá. Ať v hněvu ani v rozladění nikdo nepřeje druhému utrpení.","source":"Sutta Nipāta 1.8 · Metta sutta"},{"text":"Neřiďte se, Kálámové, ústním podáním, posloupností učitelů, doslechem, sbírkou písem, logikou, usuzováním, úvahou o příčinách, zalíbením v názoru, schopnostmi mluvčího ani tím, že „ten asketa je náš učitel“. Když sami poznáte: „Tyto věci jsou neprospěšné… vedou ke škodě a k dukkha“ — pak je opusťte.","loose":"Neřiďte se doslechem, tradicí, pověstí, písmem, úvahou, zdáním ani autoritou učitele. Když sami poznáte, že něco vede ke škodě a utrpení, opusťte to.","source":"Aṅguttara Nikāya 3.65 · Kālāma sutta"},{"text":"Tato mysl je zářivá, mniši. A je poskvrněna nečistotami, které přicházejí.","loose":"Tahle mysl je zářivá, mniši. Jen ji kalí nečistoty, které přicházejí zvenčí.","source":"Aṅguttara Nikāya 1.51"},{"text":"Dhammu jsem vás učil jako vor — k přeplutí, ne k držení.","loose":"Učení je jako vor: k přeplutí, ne k tomu, aby se nosil na zádech.","source":"Majjhima Nikāya 22 · Alagaddūpama sutta"},{"text":"Tělesnost je jako chuchvalec pěny, pocit jako bublina, vnímání jako fata morgána, sankháry jako kmen banánovníku, vědomí jako kouzelnický trik.","loose":"Tělo je jako chomáč pěny, pocit jako bublina, vnímání jako fata morgána, utváření jako kmen banánovníku, vědomí jako kouzelnický trik.","source":"Saṃyutta Nikāya 22.95 · Pheṇapiṇḍūpama sutta"},{"text":"Jsou dvě krajnosti, mniši, kterým se ten, kdo odešel do bezdomoví, nemá oddávat: lpění na smyslových požitcích a trýznění sebe sama. Tathágata se vyhnul oběma a probudil se ke střední cestě.","loose":"Jsou dvě krajnosti, kterým se má vyhnout ten, kdo odešel do bezdomoví: oddávání se požitkům a trýznění sebe sama. Mezi nimi vede střední cesta.","source":"Saṃyutta Nikāya 56.11 · Dhammacakkappavattana sutta"},{"text":"Nyní vás, mniši, oslovuji: sankháry podléhají zániku. Usilujte bděle.","loose":"Všechno složené podléhá zániku. Usilujte bděle.","source":"Dīgha Nikāya 16 · Mahāparinibbāna sutta"},{"text":"Buďte sami sobě ostrovem, sami sobě útočištěm, bez jiného útočiště; s Dhammou jako ostrovem, s Dhammou jako útočištěm, bez jiného útočiště.","loose":"Buďte sami sobě ostrovem, sami sobě útočištěm, bez jiného útočiště.","source":"Dīgha Nikāya 16 · Mahāparinibbāna sutta"},{"text":"Neříkej to, Ánando. Dobré přátelství není polovinou svatého života — je to celý svatý život.","loose":"Dobré přátelství není polovinou duchovního života, Ánando. Je to celý duchovní život.","source":"Saṃyutta Nikāya 45.2 · Upaḍḍha sutta"},{"text":"Putuj sám jako roh nosorožce.","loose":"Když nenajdeš moudrého druha, který by šel s tebou, putuj sám jako nosorožec.","source":"Sutta Nipāta 1.3 · Khaggavisāṇa sutta"},{"text":"Když jsem myslí prošel všechny strany, nenašel jsem nikoho dražšího než sebe. Stejně je každému drahý on sám — proto ať neubližuje druhým, kdo má rád sebe.","loose":"Prošel jsem v myšlenkách všechny světové strany a nenašel jsem nikoho dražšího než sebe. Tak je každému drahý on sám — kdo má rád sebe, ať neubližuje druhým.","source":"Saṃyutta Nikāya 3.8 · Mallikā sutta"},{"text":"Bez zastavování, příteli, a bez namáhání jsem překročil povodeň.","loose":"Povodeň jsem přešel tak, že jsem se nezastavil a nehnal se.","source":"Saṃyutta Nikāya 1.1 · Oghataraṇa sutta"},{"text":"I kdyby vám, mniši, lupiči oboustrannou pilou řezali úd po údu — kdo by kvůli tomu pojal v mysli zlobu, ten by mé učení nenásledoval.","loose":"I kdyby ti lupiči pilou řezali údy, kdo by kvůli tomu pojal v mysli zlobu, ten by mé učení nenásledoval.","source":"Majjhima Nikāya 21 · Kakacūpama sutta"},{"text":"O čem mnich často uvažuje a rozvažuje, mniši, tím směrem se jeho mysl naklání.","loose":"O čem člověk často přemýšlí a o čem rozvažuje, k tomu se jeho mysl naklání.","source":"Majjhima Nikāya 19 · Dvedhāvitakka sutta"},{"text":"Když je toto, je i tamto; vznikem tohoto vzniká tamto. Když toto není, není ani tamto; zánikem tohoto zaniká tamto.","loose":"Když je toto, je i tamto. Vznikem tohoto vzniká tamto. Když toto není, není ani tamto.","source":"Saṃyutta Nikāya 12.21"},{"text":"Co jsem přímo poznal a neřekl vám, mniši, je jako listí v háji. Co jsem vám řekl, je jako hrst listí v mé dlani.","loose":"To, co jsem poznal a neučil, je jako listí v lese. To, co jsem učil, je jako hrst listí v mé dlani.","source":"Saṃyutta Nikāya 56.31 · Siṃsapā sutta"},{"text":"Jako by člověk zasažený otráveným šípem řekl: „Nedám si šíp vytáhnout, dokud se nedozvím, kdo mě zasáhl, z jakého je rodu a jak se jmenuje…“ Zemřel by dřív, než by se to dozvěděl.","loose":"Je to, jako by člověk zasažený otráveným šípem nedovolil šíp vytáhnout, dokud se nedozví, kdo ho vystřelil a z jakého luku. Zemřel by dřív, než by se to dozvěděl.","source":"Majjhima Nikāya 63 · Cūḷamālukya sutta"},{"text":"Kdyby bytosti, mniši, znaly plody dávání a sdílení tak jako já, nejedly by, aniž by daly.","loose":"Kdyby lidé znali plody dávání tak jako já, nejedli by, aniž by se rozdělili.","source":"Itivuttaka 26"},{"text":"Podléhám stárnutí, stárnutí jsem nepřekonal. Podléhám nemoci… Podléhám smrti… Od všeho milého a drahého budu odloučen. Jsem vlastníkem svých činů, jejich dědicem.","loose":"Stárnu a stárnutí neuniknu. Onemocním a nemoci neuniknu. Zemřu a smrti neuniknu. Jsem dědicem svých činů.","source":"Aṅguttara Nikāya 5.57"},{"text":"Nepoučený obyčejný člověk, mniši, když ho zasáhne bolestný pocit, truchlí a naříká; cítí dva pocity, tělesný i mentální. Jako by muže zasáhli šípem a hned nato druhým šípem.","loose":"Nepoučený člověk, když ho zasáhne bolest, se trápí a naříká — jako by ho zasáhl šíp a hned nato druhý.","source":"Saṃyutta Nikāya 36.6 · Sallatha sutta"}];
  var fig = document.getElementById('q'), t = document.getElementById('qt'), s = document.getElementById('qs');
  var alt = document.getElementById('qa');
  var LKEY = 'amunet:quotes:loose';
  var loose = false;
  try{ loose = localStorage.getItem(LKEY) === '1'; }catch(e){}
  var cur = -1;
  // Zamichany balicek: kazdy citat jednou, nez se zacne opakovat. Balicek se
  // pamatuje v prohlizeci, takze kazda navsteva pokracuje dalsim citatem.
  var DKEY = 'amunet:quotes:deck';
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(DKEY) || 'null');
      if(d && d.n === Q.length && d.left && d.left.length) return d.left;
    }catch(e){}
    return null;
  }
  function save(left){ try{ localStorage.setItem(DKEY, JSON.stringify({n: Q.length, left: left})); }catch(e){} }
  var deck = load();
  function draw(){
    if(!deck || !deck.length){
      deck = Q.map(function(_, i){ return i; });
      for(var k = deck.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)); var t0 = deck[k]; deck[k] = deck[j]; deck[j] = t0; }
      if(deck.length > 1 && deck[deck.length - 1] === cur){ var t1 = deck[0]; deck[0] = deck[deck.length - 1]; deck[deck.length - 1] = t1; }
    }
    var i = deck.pop();
    save(deck);
    return i;
  }
  function show(i, animate){
    cur = i;
    var apply = function(){
      var q = Q[i];
      t.textContent = (loose && q.loose) ? q.loose : q.text;
      s.textContent = q.source;
      alt.hidden = !q.loose;
      alt.setAttribute('aria-pressed', String(loose));
      alt.title = loose ? 'Přesnější překlad' : 'Volnější překlad';
      alt.setAttribute('aria-label', loose ? 'Přepnout na přesnější překlad' : 'Přepnout na volnější překlad');
      fig.classList.remove('fading');
    };
    if(!animate) return apply();
    fig.classList.add('fading');
    setTimeout(apply, 450);
  }
  function next(){
    if(Q.length < 2) return;
    show(draw(), true);
  }
  show(draw(), false);
  fig.addEventListener('click', next);
  alt.addEventListener('click', function(e){
    e.stopPropagation();   // * prepina preklad, neprechazi na dalsi citat
    loose = !loose;
    try{ localStorage.setItem(LKEY, loose ? '1' : '0'); }catch(e2){}
    show(cur, true);
  });
})();
</script>
