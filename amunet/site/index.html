<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  padding:calc(env(safe-area-inset-top) + 2.2rem) 1.25rem 2rem;
  display:flex;flex-direction:column;justify-content:center;gap:2.6rem}
.mark{font:700 .78rem/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.mark::before{content:"";display:inline-block;width:.62rem;height:.62rem;margin-right:.55rem;
  border:2px solid var(--accent);border-radius:50%;vertical-align:-.05rem}

  text-wrap:pretty;transition:opacity .45s ease}
blockquote::before{content:"“";display:block;font-size:3rem;line-height:.6;
  color:var(--accent);margin-bottom:.55rem}
figcaption{margin-top:1rem;font:.8rem/1.4 var(--sans);color:var(--dim);transition:opacity .45s ease}

.fading blockquote,.fading figcaption{opacity:0}

  min-height:64px;padding:1rem 1.2rem;background:var(--card);border:1px solid var(--line);

nav a small{display:block;font-weight:400;font-size:.82rem;color:var(--dim);margin-top:.15rem}
nav a::after{content:"→";color:var(--accent);font-size:1.2rem;flex:0 0 auto}

nav a:active{transform:scale(.99)}
footer{padding:0 1.25rem calc(env(safe-area-inset-bottom) + 1.4rem);text-align:center;

  <figure id="q" title="Klepni pro další citát">
    <blockquote id="qt">Nevracej se k minulosti, nestav na budoucnosti. Minulé už odešlo, budoucí ještě nepřišlo. Co se děje teď, to pozoruj jasně — tady a teď.</blockquote>

<script>
(function(){
  var Q = [{"text":"Nevracej se k minulosti, nestav na budoucnosti. Minulé už odešlo, budoucí ještě nepřišlo. Co se děje teď, to pozoruj jasně — tady a teď.","source":"Majjhima Nikāya 131 · Bhaddekaratta sutta"},{"text":"Netrápí se tím, co minulo, netouží po tom, co přijde; žijí z toho, co je teď. Proto je jejich tvář klidná.","source":"Saṃyutta Nikāya 1.10 · Arañña sutta"},{"text":"Ve viděném ať je jen viděné, ve slyšeném jen slyšené, v pocítěném jen pocítěné, v poznaném jen poznané.","source":"Udāna 1.10 · Bāhiya sutta"},{"text":"Bdělost je cestou k nesmrtelnému, nedbalost cestou ke smrti. Bdělí neumírají; nedbalí jsou jako mrtví.","source":"Dhammapada 21"},{"text":"Mysl předchází všem věcem, mysl je jejich vůdcem; z mysli jsou utkány.","source":"Dhammapada 1"},{"text":"Pusť, co je před tebou, pusť, co je za tebou, pusť i to, co je mezi. S myslí volnou ve všem se už nevrátíš ke zrození a stárnutí.","source":"Dhammapada 348"},{"text":"Všímavost je ale, mniši, užitečná vždy a všude.","source":"Saṃyutta Nikāya 46.53"},{"text":"Z ponoření se rodí moudrost, bez něj moudrost uvadá.","source":"Dhammapada 282"},{"text":"Radujte se z bdělosti, střežte svou mysl.","source":"Dhammapada 327"},{"text":"Když se dlouze nadechuje, ví: „Dlouze se nadechuji.“ Když krátce vydechuje, ví: „Krátce vydechuji.“","source":"Majjhima Nikāya 118 · Ānāpānasati sutta"},{"text":"Úsilím, bdělostí, uměřeností a sebeovládáním si moudrý staví ostrov, který žádná povodeň nezaplaví.","source":"Dhammapada 25"},{"text":"Kdo chrání sebe, chrání druhé; kdo chrání druhé, chrání sebe.","source":"Saṃyutta Nikāya 47.19 · Sedaka sutta"},{"text":"Mysl předchází všem věcem, mysl je jejich vůdcem. Kdo mluví a jedná s čistou myslí, toho následuje štěstí jako stín, který nikdy neodejde.","source":"Dhammapada 2"},{"text":"„Urazil mě, uhodil mě, porazil mě, okradl mě.“ Kdo v sobě nosí takové myšlenky, v tom nenávist neutichne.","source":"Dhammapada 3"},{"text":"Nenávist se nenávistí nikdy neutiší. Utiší ji jen nenávist odložená — to je věčný zákon.","source":"Dhammapada 5"},{"text":"Jiní nechápou, že jednou všichni odejdeme. Kdo to chápe, tomu spory samy utichnou.","source":"Dhammapada 6"},{"text":"Jako déšť proniká špatně krytou střechou, tak vášeň proniká neucvičenou myslí.","source":"Dhammapada 13"},{"text":"Jako déšť neprojde dobře krytou střechou, tak vášeň neprojde myslí, která je ucvičená.","source":"Dhammapada 14"},{"text":"Kdo odříká mnoho moudrých slov, ale nežije podle nich, je jako pastýř, který počítá cizí krávy.","source":"Dhammapada 19"},{"text":"Pošetilí se oddávají nedbalosti. Moudrý střeží bdělost jako svůj největší poklad.","source":"Dhammapada 26"},{"text":"Těkavou, neklidnou mysl, kterou je těžké uhlídat, moudrý narovná, jako šípař rovná šíp.","source":"Dhammapada 33"},{"text":"Je dobré zkrotit mysl, která je prchlivá a jde, kam se jí zachce. Zkrocená mysl přináší štěstí.","source":"Dhammapada 35"},{"text":"Co nepřítel udělá nepříteli, co nenávistný nenáviděnému — víc zla ti způsobí tvá vlastní, špatně vedená mysl.","source":"Dhammapada 42"},{"text":"Ani matka, ani otec, ani žádný příbuzný ti neprokáže tolik dobra jako tvá vlastní, dobře vedená mysl.","source":"Dhammapada 43"},{"text":"Jako včela sbírá nektar a odlétá, aniž by poškodila barvu či vůni květu, tak ať mudrc prochází vesnicí.","source":"Dhammapada 49"},{"text":"Nehledej chyby druhých, co udělali a co ne. Hleď na to, co jsi udělal a neudělal ty sám.","source":"Dhammapada 50"},{"text":"Jako krásný květ, který má barvu, ale nevoní, jsou krásná slova toho, kdo podle nich nejedná.","source":"Dhammapada 51"},{"text":"Dlouhá je noc tomu, kdo bdí, dlouhá je míle unavenému, dlouhý je koloběh životů pošetilým, kteří neznají pravdu.","source":"Dhammapada 60"},{"text":"Když nenajdeš druha lepšího nebo rovného sobě, jdi pevně sám. S pošetilým není společné cesty.","source":"Dhammapada 61"},{"text":"„Mám syny, mám majetek,“ trápí se pošetilý. Vždyť ani sám sebe nevlastní — jak by pak syny, jak majetek?","source":"Dhammapada 62"},{"text":"Pošetilý, který ví o své pošetilosti, je aspoň v tom moudrý. Pošetilý, který se má za moudrého, je pošetilý doopravdy.","source":"Dhammapada 63"},{"text":"I kdyby pošetilý celý život pobýval u moudrého, pravdu nepozná — jako lžíce nepozná chuť polévky.","source":"Dhammapada 64"},{"text":"Na toho, kdo ti ukáže tvé chyby, hleď jako na toho, kdo ti ukazuje skrytý poklad.","source":"Dhammapada 76"},{"text":"Zavlažovači vedou vodu, šípaři rovnají šípy, tesaři ohýbají dřevo, moudří krotí sami sebe.","source":"Dhammapada 80"},{"text":"Jako pevnou skálou nepohne vítr, tak moudrým nepohne chvála ani hana.","source":"Dhammapada 81"},{"text":"Jako hluboké jezero je čiré a klidné, tak se zklidní moudrý, když uslyší pravdu.","source":"Dhammapada 82"},{"text":"Málokdo z lidí dojde na druhý břeh. Ostatní jen pobíhají sem a tam po tomhle.","source":"Dhammapada 85"},{"text":"Lepší než tisíc prázdných slov je jediné slovo s významem, po kterém se člověk uklidní.","source":"Dhammapada 100"},{"text":"Kdyby v bitvě porazil tisíckrát tisíc mužů — největším vítězem je ten, kdo přemůže sám sebe.","source":"Dhammapada 103"},{"text":"Lepší jeden den života moudrého a soustředěného než sto let života bez moudrosti a bez soustředění.","source":"Dhammapada 111"},{"text":"Lepší jeden den života, kdy člověk vidí vznik a zánik věcí, než sto let, kdy ho nevidí.","source":"Dhammapada 113"},{"text":"Pospěš si s dobrým, odvracej mysl od zlého. Kdo dělá dobro váhavě, jeho mysl si ve zlém libuje.","source":"Dhammapada 116"},{"text":"Nepodceňuj zlo, že tě nedostihne. I džbán se naplní kapku po kapce; pošetilý se plní zlem po troškách.","source":"Dhammapada 121"},{"text":"Nepodceňuj dobro, že ti nic nepřinese. I džbán se naplní kapku po kapce; moudrý se plní dobrem po troškách.","source":"Dhammapada 122"},{"text":"Všichni se chvějí před holí, všichni se bojí smrti. Kdo se vžije do druhého, nezabije a nenechá zabíjet.","source":"Dhammapada 129"},{"text":"Nemluv k nikomu hrubě; komu tak promluvíš, ten ti odpoví stejně.","source":"Dhammapada 133"},{"text":"Proč smích, proč veselí, když svět stále hoří? Jste zahaleni tmou — proč nehledáte světlo?","source":"Dhammapada 146"},{"text":"Zdobené královské vozy zchátrají, i tělo zestárne. Ale pravda dobrých nestárne.","source":"Dhammapada 151"},{"text":"Kdo se málo učil, stárne jako vůl: maso mu přibývá, moudrost ne.","source":"Dhammapada 152"},{"text":"Mnoha zrozeními jsem marně putoval a hledal stavitele domu. Staviteli domu, jsi odhalen — znovu už dům nepostavíš.","source":"Dhammapada 153–154"},{"text":"Ať se člověk nejdřív sám ustálí v tom, co je správné, a teprve pak učí druhé. Tak moudrý neupadne v hanu.","source":"Dhammapada 158"},{"text":"Jak radíš druhým, tak dělej sám. Jen kdo zkrotil sebe, ať krotí druhé — sebe zkrotit je skutečně těžké.","source":"Dhammapada 159"},{"text":"Sám sobě je člověk pánem — kdo jiný by jím mohl být? Kdo dobře zkrotí sám sebe, najde pána, jakého je těžké najít.","source":"Dhammapada 160"},{"text":"Zlo děláš sám a sám se jím poskvrníš; zlo sám necháš a sám se očistíš. Čistota i nečistota je na každém; nikdo neočistí druhého.","source":"Dhammapada 165"},{"text":"Kdo na svět hledí jako na bublinu, jako na fatu morgánu, toho král smrti nespatří.","source":"Dhammapada 170"},{"text":"Kdo byl dřív nedbalý a pak se stal bdělým, ten rozjasní tenhle svět jako měsíc, když vyjde z mraků.","source":"Dhammapada 172"},{"text":"Tenhle svět je slepý; jen málokdo tu vidí jasně.","source":"Dhammapada 174"},{"text":"Těžké je narodit se člověkem, těžký je život smrtelníků, těžké je uslyšet pravé učení, vzácné je, když se objeví probuzený.","source":"Dhammapada 182"},{"text":"Nedělat nic zlého, pěstovat dobré, očistit vlastní mysl — to je učení všech probuzených.","source":"Dhammapada 183"},{"text":"Trpělivost a snášenlivost jsou nejvyšší askezí.","source":"Dhammapada 184"},{"text":"Jak šťastně žijeme, bez nenávisti mezi nenávistnými.","source":"Dhammapada 197"},{"text":"Jak šťastně žijeme, my, kdo nic nevlastníme. Radost nám bude potravou jako zářícím bohům.","source":"Dhammapada 200"},{"text":"Vítězství plodí nenávist, poražený žije v bolesti. Klidný žije šťastně — vzdal se vítězství i porážky.","source":"Dhammapada 201"},{"text":"Není ohně jako vášeň, není neštěstí jako nenávist, není utrpení jako lpění na sobě, není štěstí nad klid.","source":"Dhammapada 202"},{"text":"Zdraví je největší zisk, spokojenost největší bohatství, věrný přítel nejlepší příbuzný, vyhasnutí nejvyšší štěstí.","source":"Dhammapada 204"},{"text":"Z toho, co je nám drahé, roste žal, z toho, co je nám drahé, roste strach. Kdo je od toho volný, nemá žal — odkud by pak strach?","source":"Dhammapada 212"},{"text":"Kdo zadrží vzkypělý hněv jako rozjetý vůz, toho nazývám vozatajem. Ostatní jen drží otěže.","source":"Dhammapada 222"},{"text":"Hněv přemáhej mírností, zlo dobrem, lakotu štědrostí, lháře pravdou.","source":"Dhammapada 223"},{"text":"Tak to bývalo odjakživa: hanu sklidí ten, kdo mlčí, kdo mluví hodně, i kdo mluví málo. Na světě není nikdo, koho by nehanili.","source":"Dhammapada 227"},{"text":"Nebyl, nebude a ani teď není člověk, kterého by jen hanili, nebo jen chválili.","source":"Dhammapada 228"},{"text":"Udělej si ze sebe ostrov. Snaž se hned a buď moudrý.","source":"Dhammapada 236"},{"text":"Jako kovář očišťuje stříbro od strusky, tak moudrý odstraňuje své nečistoty — postupně, kousek po kousku, chvíli po chvíli.","source":"Dhammapada 239"},{"text":"Jako rez vzejde ze železa a samo železo rozežere, tak vlastní skutky přivedou toho, kdo jedná špatně, ke zlému.","source":"Dhammapada 240"},{"text":"Není ohně jako vášeň, není sevření jako nenávist, není sítě jako klam, není řeky jako žízeň.","source":"Dhammapada 251"},{"text":"Chyby druhých se vidí snadno, vlastní těžko.","source":"Dhammapada 252"},{"text":"Moudrým není ten, kdo hodně mluví. Moudrý je ten, kdo je klidný, laskavý a nebojácný.","source":"Dhammapada 258"},{"text":"Úsilí musíte vynaložit sami. Probuzení jen ukazují cestu.","source":"Dhammapada 276"},{"text":"Všechno složené je pomíjivé. Kdo to moudře prohlédne, odvrátí se od utrpení — to je cesta k čistotě.","source":"Dhammapada 277"},{"text":"Když zřeknutím se malého štěstí lze spatřit štěstí velké, moudrý se malého vzdá a hledí k velkému.","source":"Dhammapada 290"},{"text":"Dobří září zdaleka jako zasněžené hory. Zlí nejsou vidět, jako šípy vystřelené v noci.","source":"Dhammapada 304"},{"text":"Jako slon v bitvě snese šípy vystřelené z luku, tak já snesu urážky. Vždyť mnoho lidí jedná špatně.","source":"Dhammapada 320"},{"text":"Když najdeš moudrého druha, s nímž lze jít spolu, jdi s ním radostně a bděle a překonáš všechna nebezpečí.","source":"Dhammapada 328"},{"text":"Dobré jsou přátelé, když přijde nouze; dobrá je spokojenost s tím, co je; dobrý je dobrý skutek na konci života; dobré je opustit všechno utrpení.","source":"Dhammapada 331"},{"text":"Dar pravdy předčí všechny dary, chuť pravdy všechny chutě, radost z pravdy všechny radosti. Konec žízně přemůže všechno utrpení.","source":"Dhammapada 354"},{"text":"Vylij vodu z lodi; prázdná popluje rychle. Když odřízneš vášeň a nenávist, dojdeš k vyhasnutí.","source":"Dhammapada 369"},{"text":"Bez moudrosti není ponoření, bez ponoření není moudrost. Kdo má obojí, je blízko vyhasnutí.","source":"Dhammapada 372"},{"text":"Sám se pobízej, sám se zkoumej. Kdo sám sebe střeží a je bdělý, bude žít šťastně.","source":"Dhammapada 379"},{"text":"Jako matka chrání své jediné dítě i vlastním životem, tak ať každý pěstuje k všem bytostem mysl bez hranic.","source":"Sutta Nipāta 1.8 · Metta sutta"},{"text":"Ať nikdo nikoho neklame a nikým nikde nepohrdá. Ať v hněvu ani v rozladění nikdo nepřeje druhému utrpení.","source":"Sutta Nipāta 1.8 · Metta sutta"},{"text":"Neřiďte se doslechem, tradicí, pověstí, písmem, úvahou, zdáním ani autoritou učitele. Když sami poznáte, že něco vede ke škodě a utrpení, opusťte to.","source":"Aṅguttara Nikāya 3.65 · Kālāma sutta"},{"text":"Tahle mysl je zářivá, mniši. Jen ji kalí nečistoty, které přicházejí zvenčí.","source":"Aṅguttara Nikāya 1.51"},{"text":"Učení je jako vor: k přeplutí, ne k tomu, aby se nosil na zádech.","source":"Majjhima Nikāya 22 · Alagaddūpama sutta"},{"text":"Tělo je jako chomáč pěny, pocit jako bublina, vnímání jako fata morgána, utváření jako kmen banánovníku, vědomí jako kouzelnický trik.","source":"Saṃyutta Nikāya 22.95 · Pheṇapiṇḍūpama sutta"},{"text":"Jsou dvě krajnosti, kterým se má vyhnout ten, kdo odešel do bezdomoví: oddávání se požitkům a trýznění sebe sama. Mezi nimi vede střední cesta.","source":"Saṃyutta Nikāya 56.11 · Dhammacakkappavattana sutta"},{"text":"Všechno složené podléhá zániku. Usilujte bděle.","source":"Dīgha Nikāya 16 · Mahāparinibbāna sutta"},{"text":"Buďte sami sobě ostrovem, sami sobě útočištěm, bez jiného útočiště.","source":"Dīgha Nikāya 16 · Mahāparinibbāna sutta"},{"text":"Dobré přátelství není polovinou duchovního života, Ánando. Je to celý duchovní život.","source":"Saṃyutta Nikāya 45.2 · Upaḍḍha sutta"},{"text":"Když nenajdeš moudrého druha, který by šel s tebou, putuj sám jako nosorožec.","source":"Sutta Nipāta 1.3 · Khaggavisāṇa sutta"},{"text":"Prošel jsem v myšlenkách všechny světové strany a nenašel jsem nikoho dražšího než sebe. Tak je každému drahý on sám — kdo má rád sebe, ať neubližuje druhým.","source":"Saṃyutta Nikāya 3.8 · Mallikā sutta"},{"text":"Povodeň jsem přešel tak, že jsem se nezastavil a nehnal se.","source":"Saṃyutta Nikāya 1.1 · Oghataraṇa sutta"},{"text":"I kdyby ti lupiči pilou řezali údy, kdo by kvůli tomu pojal v mysli zlobu, ten by mé učení nenásledoval.","source":"Majjhima Nikāya 21 · Kakacūpama sutta"},{"text":"O čem člověk často přemýšlí a o čem rozvažuje, k tomu se jeho mysl naklání.","source":"Majjhima Nikāya 19 · Dvedhāvitakka sutta"},{"text":"Když je toto, je i tamto. Vznikem tohoto vzniká tamto. Když toto není, není ani tamto.","source":"Saṃyutta Nikāya 12.21"},{"text":"To, co jsem poznal a neučil, je jako listí v lese. To, co jsem učil, je jako hrst listí v mé dlani.","source":"Saṃyutta Nikāya 56.31 · Siṃsapā sutta"},{"text":"Je to, jako by člověk zasažený otráveným šípem nedovolil šíp vytáhnout, dokud se nedozví, kdo ho vystřelil a z jakého luku. Zemřel by dřív, než by se to dozvěděl.","source":"Majjhima Nikāya 63 · Cūḷamālukya sutta"},{"text":"Kdyby lidé znali plody dávání tak jako já, nejedli by, aniž by se rozdělili.","source":"Itivuttaka 26"},{"text":"Stárnu a stárnutí neuniknu. Onemocním a nemoci neuniknu. Zemřu a smrti neuniknu. Jsem dědicem svých činů.","source":"Aṅguttara Nikāya 5.57"},{"text":"Nepoučený člověk, když ho zasáhne bolest, se trápí a naříká — jako by ho zasáhl šíp a hned nato druhý.","source":"Saṃyutta Nikāya 36.6 · Sallatha sutta"}];
  var fig = document.getElementById('q'), t = document.getElementById('qt'), s = document.getElementById('qs');
  var cur = -1;
  // Zamichany balicek: kazdy citat jednou, nez se zacne opakovat. Balicek se
  // pamatuje v prohlizeci, takze kazda navsteva pokracuje dalsim citatem.
  var DKEY = 'amunet:quotes:deck';
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(DKEY) || 'null');
      if(d && d.n === Q.length && d.left && d.left.length) return d.left;
    }catch(e){}
    return null;
  }
  function save(left){ try{ localStorage.setItem(DKEY, JSON.stringify({n: Q.length, left: left})); }catch(e){} }
  var deck = load();
  function draw(){
    if(!deck || !deck.length){
      deck = Q.map(function(_, i){ return i; });
      for(var k = deck.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)); var t0 = deck[k]; deck[k] = deck[j]; deck[j] = t0; }
      if(deck.length > 1 && deck[deck.length - 1] === cur){ var t1 = deck[0]; deck[0] = deck[deck.length - 1]; deck[deck.length - 1] = t1; }
    }
    var i = deck.pop();
    save(deck);
    return i;
  }
  function show(i, animate){
    cur = i;
    var apply = function(){ t.textContent = Q[i].text; s.textContent = Q[i].source; fig.classList.remove('fading'); };
    if(!animate) return apply();
    fig.classList.add('fading');
    setTimeout(apply, 450);
  }
  function next(){
    if(Q.length < 2) return;
    show(draw(), true);
  }
  show(draw(), false);
  fig.addEventListener('click', next);
})();
</script>
