<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Příručka pro Martina — Amunet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128220;</text></svg>">
<style>
{{BASE_CSS}}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) 0 0}
.hwrap{max-width:820px;margin:0 auto;padding:.7rem 1.1rem;display:flex;align-items:center;gap:.7rem}
.brand{font-weight:700;letter-spacing:-.02em;font-size:1.02rem}
.brand span{color:var(--accent)}
.hstatus{margin-left:auto;font:600 .68rem/1 var(--mono);color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--line);padding:.34rem .6rem;border-radius:99px}
nav{max-width:820px;margin:0 auto;padding:0 1.1rem .6rem;display:flex;gap:.4rem;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;font:600 .8rem/1 var(--sans);color:var(--dim);text-decoration:none;
  padding:.44rem .74rem;border-radius:99px;border:1px solid transparent;white-space:nowrap}
nav a:hover{color:var(--fg);background:var(--card)}
nav a.on{color:var(--accent);background:var(--accent-soft);border-color:var(--line)}
main{max-width:820px;margin:0 auto;padding:1.6rem 1.1rem 5rem}
section{scroll-margin-top:112px;padding-bottom:2.4rem;margin-bottom:2.4rem;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h1{font-size:1.72rem;line-height:1.2;letter-spacing:-.025em;margin:.2rem 0 1.1rem}
h2{font-size:1.2rem;letter-spacing:-.015em;margin:2.1rem 0 .7rem;padding-top:.3rem}
h3{font-size:1rem;margin:1.5rem 0 .5rem;color:var(--accent)}
p{margin:.75rem 0}
a{color:var(--accent);text-underline-offset:3px}
ul,ol{padding-left:1.35rem;margin:.75rem 0}
li{margin:.34rem 0}
code{font-family:var(--mono);font-size:.855em;background:var(--code-bg);
  padding:.14em .38em;border-radius:5px;overflow-wrap:break-word}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:11px;
  padding:.9rem 1rem;overflow-x:auto;position:relative;margin:.9rem 0;
  -webkit-overflow-scrolling:touch}
pre code{background:0;padding:0;font-size:.83rem;line-height:1.6;white-space:pre}
.copy{position:absolute;top:.35rem;right:.35rem;font:600 .68rem/1 var(--sans);
  color:var(--dim);background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:0 .7rem;min-height:34px;min-width:44px;cursor:pointer;opacity:.8}
.copy:active,.copy.ok{color:var(--accent);border-color:var(--accent);opacity:1}
blockquote{margin:1.1rem 0;padding:.85rem 1rem;background:var(--warn-bg);
  border:1px solid var(--warn-line);border-left-width:3px;border-radius:0 9px 9px 0}
blockquote p{margin:.25rem 0}
table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem;display:block;overflow-x:auto}
th,td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
td code{white-space:nowrap}
kbd{font:600 .8em var(--mono);background:var(--card);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:.1em .4em}
/* --- topologie: mobile-first, sloupec -> rada od 640px --- */
.topo{margin:1.3rem 0}
.topo-row,.topo-grid{display:flex;flex-direction:column;gap:.6rem}
.node{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:.75rem .9rem;display:flex;flex-direction:column;gap:.12rem;flex:1 1 0;min-width:0}
.node.is-accent{border-color:var(--accent);background:var(--accent-soft)}
.node b{font-size:.94rem;letter-spacing:-.01em}
.node span{font-size:.82rem;color:var(--dim);overflow-wrap:anywhere}
.node em{font-style:normal;font:600 .74rem/1.5 var(--mono);color:var(--accent);margin-top:.2rem}
.node code{font-size:.78em}
.topo-row .node{position:relative}
.topo-row .node+.node::before{content:"↓";position:absolute;top:-.62rem;left:50%;
  transform:translateX(-50%);font:700 .8rem/1 var(--sans);color:var(--accent)}
.topo-cap{font:600 .72rem/1 var(--sans);text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);margin:1.5rem 0 .6rem}
.topo-flow{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.4rem;
  counter-reset:tf}
.topo-flow li{counter-increment:tf;display:flex;align-items:center;gap:.6rem;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:.55rem .8rem;font-size:.85rem}
.topo-flow li::before{content:counter(tf);flex:0 0 auto;width:1.35rem;height:1.35rem;
  display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);
  color:var(--accent);font:700 .7rem/1 var(--mono)}
.topo-flow li.is-hl{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
@media (min-width:640px){
  .topo-row{flex-direction:row;align-items:stretch}
  .topo-grid{flex-direction:row}
  .topo-row .node+.node::before{content:"→";top:50%;left:-.58rem;transform:translateY(-50%)}
  .topo-row{gap:1.15rem}
}
.task{list-style:none;margin-left:-1.35rem}
.task li{display:flex;gap:.75rem;align-items:flex-start;padding:.7rem .8rem;margin:.4rem 0;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
.task li:active{border-color:var(--accent)}
.task input{flex:0 0 auto;margin:.1rem 0 0;width:1.45rem;height:1.45rem;
  accent-color:var(--accent);cursor:pointer}
.task li.done{opacity:.5}
.task li.done .tt{text-decoration:line-through}
.tt{flex:1}
footer{max-width:820px;margin:0 auto;padding:0 1.1rem 3rem;color:var(--dim);
  font:.76rem/1.6 var(--mono)}
@media (max-width:600px){
  body{font-size:16px}
  h1{font-size:1.48rem} h2{font-size:1.1rem}
  main{padding:1.2rem .95rem 4rem}
  section{scroll-margin-top:104px}
  pre code{font-size:.78rem}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <a class="brand back" href="../">Amunet <span>/ příručka</span></a>
    <div class="hstatus">TAILSCALE OK</div>
  </div>
  <nav>{{NAV}}</nav>
</header>
<main>{{CONTENT}}</main>
<footer>amunet-rogan/infra · sestaveno {{BUILT}}</footer>
<script>
(function(){
  // GFM task-listy -> perzistentni odskrtavaci ukoly.
  // marked renderuje "- [ ] text" jako <li><input disabled type=checkbox>text</li>,
  // takze disabled odstranime a doplnime ulozeni stavu do localStorage.
  // marked: tesny seznam -> <li><input>text</li>, volny -> <li><p><input>text</p>...</li>.
  // V obou pripadech presuneme checkbox na zacatek <li> a zbytek zabalime do .tt.
  document.querySelectorAll('li input[type=checkbox]').forEach(function(box){
    var li = box.closest('li');
    li.parentElement.classList.add('task');
    box.removeAttribute('disabled');
    li.insertBefore(box, li.firstChild);
    var span = document.createElement('span');
    span.className = 'tt';
    while(box.nextSibling) span.appendChild(box.nextSibling);
    li.appendChild(span);
    span.querySelectorAll('p').forEach(function(pp){ pp.style.margin = '0'; });

    var key = 'amunet:ck:' + span.textContent.trim().replace(/\s+/g,' ').slice(0,70);
    var saved = null;
    try{ saved = localStorage.getItem(key); }catch(e){}
    if(saved !== null) box.checked = (saved === '1');
    li.classList.toggle('done', box.checked);

    box.addEventListener('change', function(){
      li.classList.toggle('done', box.checked);
      try{
        box.checked ? localStorage.setItem(key,'1') : localStorage.setItem(key,'0');
      }catch(e){}
    });

    // Cely radek jako tap target — na telefonu je 24px checkbox pod hranici pouzitelnosti.
    li.addEventListener('click', function(ev){
      if(ev.target === box) return;                  // checkbox si poradi sam
      if(ev.target.closest('a, code, pre')) return;  // odkazy a kod necháme byt
      box.checked = !box.checked;
      box.dispatchEvent(new Event('change'));
    });
  });

  // Kopirovani kodu
  document.querySelectorAll('pre').forEach(function(pre){
    var b = document.createElement('button');
    b.className='copy'; b.type='button'; b.textContent='kopírovat';
    b.addEventListener('click', function(){
      var txt = pre.querySelector('code').textContent;
      var done = function(){ b.textContent='zkopírováno'; b.classList.add('ok');
        setTimeout(function(){ b.textContent='kopírovat'; b.classList.remove('ok'); },1400); };
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(txt).then(done);
      } else {
        var ta=document.createElement('textarea'); ta.value=txt;
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); done(); }catch(e){}
        document.body.removeChild(ta);
      }
    });
    pre.appendChild(b);
  });

  // Zvyrazneni aktivni sekce v navigaci
  var links = [].slice.call(document.querySelectorAll('nav a'));
  var secs  = links.map(function(a){ return document.querySelector(a.getAttribute('href')); });
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var i = secs.indexOf(e.target);
      links.forEach(function(l,j){ l.classList.toggle('on', i===j); });
    });
  }, {rootMargin:'-110px 0px -70% 0px'});
  secs.forEach(function(s){ if(s) obs.observe(s); });
})();
</script>
</body>
</html>
